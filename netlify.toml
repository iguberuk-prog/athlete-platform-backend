# Netlify configuration for the athlete platform backend + simple web UI.
#
# In the Netlify UI the site's "Base directory" is empty (repo root).
# Static pages are served from public/; TypeScript functions in
# netlify/functions are bundled by esbuild automatically.

[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # Native module used only for local dev; never bundled into deployed functions.
  external_node_modules = ["better-sqlite3"]

[dev]
  framework = "#static"
