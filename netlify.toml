# Netlify configuration for the athlete platform backend + simple web UI.
#
# In the Netlify UI the site's "Base directory" is empty (repo root).
# Static pages are served from public/; TypeScript functions in
# netlify/functions are bundled by esbuild automatically.

[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Native module used only for local dev; never bundled into deployed functions.
  external_node_modules = ["better-sqlite3", "ws", "bufferutil", "utf-8-validate"]

[dev]
  framework = "#static"

# Service worker must never be cached, so app updates reach phones right away.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
